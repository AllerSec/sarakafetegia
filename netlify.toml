# netlify.toml — Sara Kafetegia
# Sitio estático servido desde la raíz del repo (compatible con GitHub Pages).

[build]
  publish = "."

# ---- Cabeceras ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Caché agresiva solo para assets cuyo contenido no cambia (fotos, vídeo, fuentes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS y JS NO llevan hash en el nombre de archivo: cachearlos como immutable
# deja a los móviles con versiones viejas durante un año (bug real visto en
# iOS: navbar rota y hero ilegible por un components.css antiguo cacheado).
# Revalidación con ETag: el navegador recibe 304 si el archivo no cambió.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# llms.txt / llms-full.txt servidos como text/plain
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# HTML: revalidar (no cachear de forma agresiva)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- 404 ----
# Netlify usa 404.html automáticamente para rutas no encontradas.
# 404 por idioma primero (el orden importa); respaldo en español al final.
[[redirects]]
  from = "/eu/*"
  to = "/eu/404.html"
  status = 404

[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[redirects]]
  from = "/fr/*"
  to = "/fr/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
